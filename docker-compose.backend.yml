name: lima-ui-backend

services:
  mongo:
    image: mongo:6.0.26
    restart: always
    ports:
      - ${HOST_MONGO_PORT:-${MONGO_PORT:-27017}}:27017
    volumes:
      - mongo-data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
    env_file:
      - .env
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh -u $${MONGO_INITDB_ROOT_USERNAME} -p $${MONGO_INITDB_ROOT_PASSWORD} --authenticationDatabase admin --quiet --eval 'db.adminCommand({ping:1}).ok'",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  mailslurper:
    image: marcopas/docker-mailslurper
    restart: always
    ports:
      - "2500:2500"
      - "8080:8080"
      - "8085:8085"

volumes:
  mongo-data:
    driver: local
