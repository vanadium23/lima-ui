<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html lang="ru" xmlns="http://www.w3.org/1999/xhtml">
<head>

    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="x-apple-disable-message-reformatting"/>
    <meta name="color-scheme" content="light dark"/>
    <meta name="supported-color-schemes" content="light dark"/>

    <title></title>

    <style type="text/css">
        body {
            margin:0;
            padding:0;
        }
        table {
            border-spacing:0;
        }
        img {
            display:block;
            border:0;
        }
    </style>

    <!--[if mso]>
    <style type="text/css">
        table {border-collapse:collapse;}
    </style>
    <![endif]-->

</head>

<body style="margin:0;padding:0;background-color:#ffffff;">

<!-- PREHEADER -->
<div style="display:none;max-height:0;overflow:hidden;opacity:0;">
    {preheader}
</div>

<center style="width:100%;table-layout:fixed;">

    <table width="100%" cellpadding="0" cellspacing="0" role="presentation">
        <tr>
            <td align="center">

                <!-- MAIN CONTAINER -->
                <table width="100%" style="max-width:600px;background-color:#ffffff;font-family:Arial, sans-serif;" cellpadding="0" cellspacing="0" role="presentation">

                    <!-- HEADER -->
                    <tr>
                        <td style="padding:30px 28px 10px 28px;">
                            <table cellpadding="0" cellspacing="0" role="presentation">
                                <tr>
                                    <td valign="middle">
                                        <img src="https://svernik.ru/images/logo_lima.png" width="21" height="26" alt="Logo">
                                    </td>
                                    <td valign="middle" style="padding-left:6px;">
                                        <p style="margin:0;font-size:16px;font-weight:bold;color:#0285f1;">
                                            Lima
                                        </p>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- TEXT -->
                    <tr>
                        <td style="padding:10px 28px 15px 28px;">
                            <p style="margin:0;font-size:16px;line-height:1.4;color:#05060f;">
                                {main-text}
                            </p>
                        </td>
                    </tr>

                    <!-- BUTTON -->
                    <tr>
                        <td align="center" style="padding:15px;">
                            <table cellpadding="0" cellspacing="0" role="presentation" bgcolor="#0285f1" style="border-radius:8px;">
                                <tr>
                                    <td align="center" width="198" height="34">
                                        <a href="{button-link}"
                                           target="_blank"
                                           style="display:block;width:198px;height:34px;line-height:34px;
                                           font-size:16px;color:#ffffff;text-decoration:none;">
                                            {button-text}
                                        </a>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- FOOTER TEXT -->
                    <tr>
                        <td style="padding:15px 28px;">
                            <p style="margin:0;font-size:16px;line-height:1.4;color:#05060f;">
                                С уважением, команда Lima. Рады, что вы с нами!
                            </p>
                        </td>
                    </tr>

                    <!-- FOOTER -->
                    <tr>
                        <td style="background-color:#eeeeee;padding:15px 20px;">

                            <table width="100%" cellpadding="0" cellspacing="0" role="presentation">

                                <tr>
                                    <td>
                                        <table cellpadding="0" cellspacing="0" role="presentation">
                                            <tr>
                                                <td valign="middle">
                                                    <p style="margin:0;font-size:14px;color:#444444;">
                                                        Присоединяйтесь к нашему блогу
                                                    </p>
                                                </td>
                                                <td valign="middle" style="padding-left:8px;">
                                                    <a href="https://t.me/itakspisok">
                                                        <img src="https://svernik.ru/images/logo_tg.png" width="32" height="32" alt="Telegram">
                                                    </a>
                                                </td>
                                                <td valign="middle" style="padding-left:8px;">
                                                    <a href="https://t.me/itakspisok">
                                                        <img src="https://svernik.ru/images/logo_max.png" width="32" height="32" alt="Max">
                                                    </a>
                                                </td>
                                            </tr>
                                        </table>
                                    </td>
                                </tr>

                                <tr>
                                    <td style="padding:10px 0;">
                                        <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                                            <tr>
                                                <td style="height:1px; background-color:#cccccc; line-height:1px; font-size:0;">
                                                    &nbsp;
                                                </td>
                                            </tr>
                                        </table>
                                    </td>
                                </tr>

                                <tr>
                                    <td>
                                        <p style="margin:0;font-size:12px;line-height:1.4;color:#444444;">
                                            Вы получили это письмо, потому что зарегистрированы на сайте и являетесь пользователем сервиса Lima на основании
                                            <a href="{user-agreement}" style="color:#0285f1;">Пользовательского соглашения</a>.
                                        </p>
                                    </td>
                                </tr>

                                <tr>
                                    <td style="padding-top:10px;">
                                        <a href="{unsubscribe-from-mailing-list}"
                                           style="font-size:12px;color:#0285f1;text-decoration:underline;">
                                            Отписаться от рассылки
                                        </a>
                                    </td>
                                </tr>

                            </table>

                        </td>
                    </tr>

                </table>

            </td>
        </tr>
    </table>

</center>

</body>
</html>
