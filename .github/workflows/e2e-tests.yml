name: E2E Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "src-ts/**"
      - "features/**"
      - "scripts/**"
      - "utilities/**"
      - "public/**"
      - "configuration.ts"
      - "astro.config.mjs"
      - "tsconfig.json"
      - "package.json"
      - "package-lock.json"
      - "docker-compose.yml"
      - "docker-compose.backend.yml"
      - "docker-compose.prod-test.yml"
      - "Dockerfile"
      - "Dockerfile.app"
      - ".env.example"
      - ".github/workflows/e2e-tests.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  e2e-tests:
    # The whole application (TS API + Astro UI) is built from this
    # repository as a single container (Dockerfile.app): no cross-repo
    # backend checkout and no LIMA_BACKEND_REPO_TOKEN needed anymore.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        device: [desktop, tablet, mobile]
        include:
          - device: desktop
            backend-port: 3000
            frontend-port: 4321
          - device: tablet
            backend-port: 3001
            frontend-port: 4322
          - device: mobile
            backend-port: 3002
            frontend-port: 4323

    steps:
      - name: Checkout UI repository
        uses: actions/checkout@v4
        with:
          path: lima-UI

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: lima-UI/package.json
          cache: "npm"
          cache-dependency-path: lima-UI/package-lock.json

      - name: Install UI dependencies
        run: npm ci
        working-directory: lima-UI

      - name: Install Playwright browsers
        run: npx playwright install --with-deps
        working-directory: lima-UI

      - name: Start the application (backend + database + front-end)
        run: |
          cp .env.example .env
          docker compose -f docker-compose.prod-test.yml -p lima-${{ matrix.device }} up -d --build
          # Verify the API is responding with expected data
          timeout 240 bash -c 'until curl -s http://localhost:${{ matrix.backend-port }}/ | jq -e ".greeting" > /dev/null; do sleep 10; done'
          # Wait for the front-end to be available
          timeout 120 bash -c 'until curl -s http://localhost:${{ matrix.frontend-port }}/ > /dev/null; do sleep 5; done'
        working-directory: lima-UI
        env:
          HOST_PORT: ${{ matrix.backend-port }}
          PORT: 3000
          FRONTEND_PORT: ${{ matrix.frontend-port }}
          CLIENT_ADDRESS: http://localhost:${{ matrix.frontend-port }}

      - name: Run E2E tests
        run: npm test -- --${{ matrix.device }} --verbose --retry 1
        working-directory: lima-UI
        env:
          PUBLIC_API_URL: http://localhost:${{ matrix.backend-port }}
          CLIENT_ADDRESS: http://localhost:${{ matrix.frontend-port }}

      - name: Stop services
        if: always()
        run: docker compose -f docker-compose.prod-test.yml -p lima-${{ matrix.device }} down
        working-directory: lima-UI

      # Set variables for the artifact name that doesn't contain invalid characters
      - name: Set artifact variables
        id: artifact_vars
        run: |
          echo "timestamp=$(date +'%Y-%m-%d-%H-%M')" >> $GITHUB_OUTPUT
          echo "short_sha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
        shell: bash

      - name: Upload test results and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "e2e-test-artifacts-${{ matrix.device }}-${{ github.run_number }}-${{ github.run_attempt }}-${{ steps.artifact_vars.outputs.short_sha }}-PR${{ github.event.pull_request.number }}-${{ steps.artifact_vars.outputs.timestamp }}"
          path: |
            lima-UI/features/results/
