name: E2E Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "features/**"
      - "scripts/**"
      - "utilities/**"
      - "public/**"
      - "configuration.ts"
      - "astro.config.mjs"
      - "tsconfig.json"
      - "eslint.config.mjs"
      - "docker-compose.yml"
      - "docker-compose.prod-test.yml"
      - "Dockerfile"
      - "Dockerfile.prod-test"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        device: [desktop, tablet, mobile]
        include:
          - device: desktop
            backend-port: 3000
            frontend-port: 4321
          - device: tablet
            backend-port: 3001
            frontend-port: 4322
          - device: mobile
            backend-port: 3002
            frontend-port: 4323

    steps:
      - name: Verify required secrets
        run: |
          MISSING_SECRETS=()

          if [ -z "${{ secrets.LIMA_BACKEND_REPO_TOKEN }}" ]; then
            MISSING_SECRETS+=("LIMA_BACKEND_REPO_TOKEN")
          fi

          if [ ${#MISSING_SECRETS[@]} -gt 0 ]; then
            echo "❌ Error: The following required secrets are missing:"
            printf '  - %s\n' "${MISSING_SECRETS[@]}"
            echo ""
            echo "Please configure these secrets in:"
            echo "https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 1
          fi

          echo "✅ All required secrets are configured"

      - name: Checkout UI repository
        uses: actions/checkout@v4
        with:
          path: lima-UI

      - name: Checkout Lima backend repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/lima
          token: ${{ secrets.LIMA_BACKEND_REPO_TOKEN }}
          path: lima

      - name: Configure backend environment
        run: |
          cp lima/.env.example lima/.env

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: lima-UI/package.json
          cache: "npm"
          cache-dependency-path: lima-UI/package-lock.json

      - name: Install UI dependencies
        run: npm ci
        working-directory: lima-UI

      - name: Install Playwright browsers
        run: npx playwright install --with-deps
        working-directory: lima-UI

      - name: Start backend, database, and front-end
        run: |
          docker compose -f docker-compose.prod-test.yml -p lima-${{ matrix.device }} up -d --build
          # Verify backend API is responding with expected data
          timeout 180 bash -c 'until curl -s http://localhost:${{ matrix.backend-port }}/ | jq -e ".greeting" > /dev/null; do sleep 10; done'
          # Wait for the front-end to be available
          timeout 120 bash -c 'until curl -s http://localhost:${{ matrix.frontend-port }}/ > /dev/null; do sleep 5; done'
        working-directory: lima-UI
        env:
          HOST_PORT: ${{ matrix.backend-port }}
          PORT: 3000
          FRONTEND_PORT: ${{ matrix.frontend-port }}
          CLIENT_ADDRESS: http://localhost:${{ matrix.frontend-port }}

      - name: Run E2E tests
        run: npm test -- --${{ matrix.device }} --verbose --retry 1
        working-directory: lima-UI
        env:
          PUBLIC_API_URL: http://localhost:${{ matrix.backend-port }}
          CLIENT_ADDRESS: http://localhost:${{ matrix.frontend-port }}

      - name: Stop services
        if: always()
        run: docker compose -f docker-compose.prod-test.yml -p lima-${{ matrix.device }} down
        working-directory: lima-UI

      # Set variables for the artifact name that doesn't contain invalid characters
      - name: Set artifact variables
        id: artifact_vars
        run: |
          echo "timestamp=$(date +'%Y-%m-%d-%H-%M')" >> $GITHUB_OUTPUT
          echo "short_sha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
        shell: bash

      - name: Upload test results and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "e2e-test-artifacts-${{ matrix.device }}-${{ github.run_number }}-${{ github.run_attempt }}-${{ steps.artifact_vars.outputs.short_sha }}-PR${{ github.event.pull_request.number }}-${{ steps.artifact_vars.outputs.timestamp }}"
          path: |
            lima-UI/features/results/
